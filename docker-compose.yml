# =============================================================================
# Sub2API Docker Compose - Privacy-Preserving Production Layout
# =============================================================================
# Persistent state lives below an explicitly configured /mnt/data root. Compose
# must never create a missing host directory because an empty bind mount can
# make a failed migration look like a clean installation.
#
# Quick Start:
#   1. Copy .env.example to .env and configure it with mode 0600.
#   2. Pre-create app, postgres, redis/nonce, safe-backup, and exports below
#      /mnt/data/sub2api-gate with the ownership documented in deploy/README.md.
#   3. Run deploy/security-preflight.sh check before any Compose action.
# =============================================================================

# Force direct Compose callers to provide the reviewed root while keeping every
# bind source fixed below. Preflight additionally verifies the value is exact.
x-required-data-root: ${SUB2API_DATA_ROOT:?SUB2API_DATA_ROOT must be /mnt/data/sub2api-gate}

services:
  # ===========================================================================
  # Sub2API Application
  # ===========================================================================
  sub2api:
    # Reviewed recreate baseline: Sub2API 0.1.176
    image: weishaw/sub2api@sha256:905baf250580334dacd902471f61da7b8b1e5da57e3c8c1769489952d51771a1
    container_name: sub2api
    restart: unless-stopped
    user: "1000:1000"
    # Writable root lets admin online updates replace /app/sub2api. Additive
    # goose migrations are allowed; privacy-table/trigger/function DDL stays
    # blocked. Recreate/re-pull still returns to the reviewed digest.
    init: true
    # This upstream version has error paths that can print response bodies even
    # when body logging is disabled. Discard stdout/stderr at the Docker layer.
    logging:
      driver: "none"
    ulimits:
      core:
        soft: 0
        hard: 0
      nofile:
        soft: 100000
        hard: 100000
    ports:
      # Nginx has a fixed loopback upstream at 127.0.0.1:8080. Keeping this
      # literal prevents a stale shell or .env override from exposing Sub2API
      # directly or disconnecting it from the reviewed request path.
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: /mnt/data/sub2api-gate/app
        target: /app/data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=1000,gid=1000
    environment:
      # =======================================================================
      # Auto Setup (REQUIRED for Docker deployment)
      # =======================================================================
      - AUTO_SETUP=false
      # Sub2API 0.1.176 probes DATA_DIR for writability and its pricing service
      # atomically refreshes reviewed model metadata here. The bind itself is
      # owner-only.
      - DATA_DIR=/app/data
      - PRICING_DATA_DIR=/app/data

      # =======================================================================
      # Server Configuration
      # =======================================================================
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=release
      - RUN_MODE=standard

      # =======================================================================
      # Database Configuration (PostgreSQL)
      # =======================================================================
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      # Schema/bootstrap migrations use the owner out of band. The runtime is
      # deliberately unable to disable privacy triggers or perform DDL.
      - DATABASE_USER=sub2api_app
      - DATABASE_PASSWORD=${SUB2API_APP_DATABASE_PASSWORD:?SUB2API_APP_DATABASE_PASSWORD is required}
      - DATABASE_DBNAME=${POSTGRES_DB:-sub2api}
      - DATABASE_SSLMODE=disable
      - DATABASE_MAX_OPEN_CONNS=${DATABASE_MAX_OPEN_CONNS:-50}
      - DATABASE_MAX_IDLE_CONNS=${DATABASE_MAX_IDLE_CONNS:-10}
      - DATABASE_CONN_MAX_LIFETIME_MINUTES=${DATABASE_CONN_MAX_LIFETIME_MINUTES:-30}
      - DATABASE_CONN_MAX_IDLE_TIME_MINUTES=${DATABASE_CONN_MAX_IDLE_TIME_MINUTES:-5}

      # =======================================================================
      # Redis Configuration
      # =======================================================================
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-1024}
      - REDIS_MIN_IDLE_CONNS=${REDIS_MIN_IDLE_CONNS:-10}
      - REDIS_ENABLE_TLS=${REDIS_ENABLE_TLS:-false}

      # =======================================================================
      # JWT Configuration
      # =======================================================================
      # IMPORTANT: Set a fixed JWT_SECRET to prevent login sessions from being
      # invalidated after container restarts. If left empty, a random secret
      # will be generated on each startup.
      # Generate a secure secret: openssl rand -hex 32
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRE_HOUR=${JWT_EXPIRE_HOUR:-24}

      # =======================================================================
      # TOTP (2FA) Configuration
      # =======================================================================
      # IMPORTANT: Set a fixed encryption key for TOTP secrets. If left empty,
      # a random key will be generated on each startup, causing all existing
      # TOTP configurations to become invalid (users won't be able to login
      # with 2FA).
      # Generate a secure key: openssl rand -hex 32
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}

      # =======================================================================
      # Timezone Configuration
      # This affects ALL time operations in the application:
      # - Database timestamps
      # - Usage statistics "today" boundary
      # - Subscription expiry times
      # - Log timestamps
      # Common values: Asia/Shanghai, America/New_York, Europe/London, UTC
      # =======================================================================
      - TZ=${TZ:-Asia/Shanghai}

      # =======================================================================
      # Gemini OAuth Configuration (for Gemini accounts)
      # =======================================================================
      - GEMINI_OAUTH_CLIENT_ID=${GEMINI_OAUTH_CLIENT_ID:-}
      - GEMINI_OAUTH_CLIENT_SECRET=${GEMINI_OAUTH_CLIENT_SECRET:-}
      - GEMINI_OAUTH_SCOPES=${GEMINI_OAUTH_SCOPES:-}
      - GEMINI_QUOTA_POLICY=${GEMINI_QUOTA_POLICY:-}

      # Built-in OAuth client secrets (optional)
      # SECURITY: This repo does not embed third-party client_secret.
      - GEMINI_CLI_OAUTH_CLIENT_SECRET=${GEMINI_CLI_OAUTH_CLIENT_SECRET:-}
      - ANTIGRAVITY_OAUTH_CLIENT_SECRET=${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}

      # =======================================================================
      # Security Configuration (URL Allowlist)
      # =======================================================================
      # Enable URL allowlist validation (false to skip allowlist checks)
      - SECURITY_URL_ALLOWLIST_ENABLED=true
      # Allow insecure HTTP URLs when allowlist is disabled (default: false, requires https)
      - SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP=false
      # Allow private IP addresses for upstream/pricing/CRS (for internal deployments)
      - SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS=false
      # Upstream hosts whitelist (comma-separated, only used when enabled=true)
      - SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS=${SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS:?SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS is required}

      # Never persist upstream request/response content in application logs.
      - LOG_OUTPUT_TO_FILE=false
      - LOG_OUTPUT_TO_STDOUT=true
      - GATEWAY_LOG_UPSTREAM_ERROR_BODY=false
      - RISK_CONTROL_ENABLED=false
      - IMAGE_STORAGE_ENABLED=false

      # =======================================================================
      # Update Configuration (在线更新配置)
      # =======================================================================
      # Proxy for accessing GitHub (online updates + pricing data).
      # Examples: http://host:port, socks5://host:port
      - UPDATE_PROXY_URL=${UPDATE_PROXY_URL:-}
      - UPDATE_GITHUB_TOKEN=${UPDATE_GITHUB_TOKEN:-}

      # =======================================================================
      # Image Generation Stream & Concurrency
      # =======================================================================
      - GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT=${GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT:-900}
      - GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL=${GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL:-10}
      - GATEWAY_IMAGE_CONCURRENCY_ENABLED=${GATEWAY_IMAGE_CONCURRENCY_ENABLED:-false}
      - GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS=${GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS:-0}
      - GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE=${GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE:-reject}
      - GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS=${GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS:-30}
      - GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS=${GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sub2api-data
      - sub2api-egress
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Do not pin --version: later admin online updates change the binary while
      # the reviewed Sub2API 0.1.176 digest remains the recreate baseline.
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  sub2api-sync:
    # Built and attested before the maintenance window by sync-canary.py.
    # Runtime Compose is deliberately unable to build or pull this image.
    image: sub2api-gate/sub2api-sync:pg18.4-r1
    pull_policy: never
    container_name: sub2api-sync
    restart: unless-stopped
    # Sync emits stable codes only, but the host must not retain stderr output.
    logging:
      driver: "none"
    user: "65532:65532"
    read_only: true
    init: true
    ports:
      - "127.0.0.1:3021:3021"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - SUB2API_SYNC_HOST=0.0.0.0
      - SUB2API_SYNC_PORT=3021
      - SUB2API_SYNC_SECRET=${SUB2API_SYNC_SECRET:?SUB2API_SYNC_SECRET is required}
      - SUB2API_SYNC_DATABASE_HOST=postgres
      - SUB2API_SYNC_DATABASE_PORT=5432
      - SUB2API_SYNC_DATABASE_NAME=${POSTGRES_DB:-sub2api}
      - SUB2API_SYNC_DATABASE_USER=sub2api_sync
      - SUB2API_SYNC_DATABASE_PASSWORD=${SUB2API_SYNC_DATABASE_PASSWORD:?SUB2API_SYNC_DATABASE_PASSWORD is required}
      - SUB2API_SYNC_REDIS_HOST=redis-nonce
      - SUB2API_SYNC_REDIS_PORT=6379
      - SUB2API_SYNC_REDIS_USERNAME=sub2api_sync
      - SUB2API_SYNC_REDIS_PASSWORD=${SUB2API_SYNC_REDIS_PASSWORD:?SUB2API_SYNC_REDIS_PASSWORD is required}
      - SUB2API_SYNC_REDIS_DB=${REDIS_DB:-0}
      - SUB2API_INTERNAL_LOGIN_URL=http://sub2api:8080/api/v1/auth/login
      - SUB2API_SYNC_DEFAULT_GROUP=openai-default
      - SUB2API_LOGIN_URL=${SUB2API_LOGIN_URL:?SUB2API_LOGIN_URL is required}
      - SUB2API_PUBLIC_BASE_URL=${SUB2API_PUBLIC_BASE_URL:?SUB2API_PUBLIC_BASE_URL is required}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.50
    ulimits:
      core:
        soft: 0
        hard: 0
    depends_on:
      postgres:
        condition: service_healthy
      redis-nonce:
        condition: service_healthy
      sub2api:
        condition: service_healthy
    networks:
      - sub2api-data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3021/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: sub2api-postgres
    restart: unless-stopped
    user: "70:70"
    read_only: true
    command:
      - postgres
      - -c
      - logging_collector=off
      - -c
      - log_destination=stderr
      - -c
      - log_directory=log
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_min_messages=panic
      - -c
      - log_error_verbosity=terse
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_duration=off
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_duration_sample=-1
      - -c
      - log_statement_sample_rate=0
      - -c
      - log_transaction_sample_rate=0
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_replication_commands=off
      - -c
      - log_checkpoints=off
      - -c
      - log_lock_waits=off
      - -c
      - log_temp_files=-1
      - -c
      - log_autovacuum_min_duration=-1
      - -c
      - debug_print_parse=off
      - -c
      - debug_print_rewritten=off
      - -c
      - debug_print_plan=off
      - -c
      - log_parser_stats=off
      - -c
      - log_planner_stats=off
      - -c
      - log_executor_stats=off
      - -c
      - log_statement_stats=off
    # PostgreSQL errors can include statement detail; do not persist container logs.
    logging:
      driver: "none"
    ulimits:
      core:
        soft: 0
        hard: 0
      nofile:
        soft: 100000
        hard: 100000
    volumes:
      # PostgreSQL 18's official image requires one mount at this parent and
      # stores each major version in its own nested directory.
      - type: bind
        source: /mnt/data/sub2api-gate/postgres
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    tmpfs:
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=8m,mode=0770,uid=70,gid=70
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=70,gid=70
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sub2api}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-sub2api}
      - PGDATA=/var/lib/postgresql/18/docker
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - sub2api-data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          postgres --version | grep -E ' 18\.' >/dev/null &&
          pg_isready -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # 注意：不暴露端口到宿主机，应用通过内部网络连接
    # 如需调试，可临时添加：ports: ["127.0.0.1:5433:5432"]

  # ===========================================================================
  # Sub2API Redis Cache
  #
  # Sub2API stores raw OAuth tokens, temporary TOTP state, scheduler account
  # snapshots, and request-derived routing identifiers in Redis. Redis OSS
  # cannot omit selected key prefixes from RDB/AOF, so its persistence directory
  # is tmpfs-backed and all Redis persistence is disabled. It always starts
  # empty; PostgreSQL is the system of record and no app Redis migration exists.
  # ===========================================================================
  redis:
    image: redis@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    container_name: sub2api-redis
    restart: unless-stopped
    user: "999:1000"
    read_only: true
    mem_limit: 256m
    logging:
      driver: "none"
    ulimits:
      core:
        soft: 0
        hard: 0
      nofile:
        soft: 100000
        hard: 100000
    volumes:
      - type: bind
        source: /mnt/data/sub2api-gate/redis/users.acl
        target: /etc/redis/users.acl
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /data:rw,noexec,nosuid,nodev,size=128m,mode=0700,uid=999,gid=1000
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=999,gid=1000
    command:
      - redis-server
      - --aclfile
      - /etc/redis/users.acl
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
      - --rdbcompression
      - "yes"
      - --rdbchecksum
      - "yes"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - REDISCLI_AUTH=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks:
      - sub2api-data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-server --version | grep -F 'v=8.8.0' >/dev/null &&
          redis-cli --user default ping | grep -qx PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Replay-protection Redis
  # ---------------------------------------------------------------------------
  # This instance accepts only HMAC nonce markers. AOF fsyncs every accepted
  # SET before it is acknowledged so a crash cannot reopen the signed-request
  # replay window. It never receives Sub2API cache, token, or scheduler keys.
  redis-nonce:
    image: redis@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    container_name: sub2api-redis-nonce
    restart: unless-stopped
    user: "999:1000"
    read_only: true
    mem_limit: 128m
    logging:
      driver: "none"
    ulimits:
      core:
        soft: 0
        hard: 0
    volumes:
      - type: bind
        source: /mnt/data/sub2api-gate/redis/nonce
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/data/sub2api-gate/redis/nonce-users.acl
        target: /etc/redis/users.acl
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=999,gid=1000
    command:
      - redis-server
      - --aclfile
      - /etc/redis/users.acl
      - --appendonly
      - "yes"
      - --appendfsync
      - "always"
      - --save
      - ""
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - noeviction
      # Redis 8.8.0's bundled Search module refuses to start with an AOF when
      # the RDB preamble is disabled. This remains a nonce-only AOF.
      - --aof-use-rdb-preamble
      - "yes"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - REDISCLI_AUTH=${SUB2API_SYNC_REDIS_PASSWORD:?SUB2API_SYNC_REDIS_PASSWORD is required}
    networks:
      - sub2api-data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-server --version | grep -F 'v=8.8.0' >/dev/null &&
          redis-cli --user sub2api_sync ping | grep -qx PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# =============================================================================
# Networks
# =============================================================================
networks:
  sub2api-data:
    internal: true
  sub2api-egress: {}
