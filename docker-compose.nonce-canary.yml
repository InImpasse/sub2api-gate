name: sub2api-gate-nonce-canary

# Isolated nonce-only Redis for the future traffic-canary data migration. This
# service is never used by the active production sync canary or /v1 routing.
x-required-data-root: ${SUB2API_DATA_ROOT:?SUB2API_DATA_ROOT must be /mnt/data/sub2api-gate}

services:
  sync-canary-redis-nonce:
    profiles: ["nonce-canary"]
    image: redis@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    pull_policy: never
    container_name: sub2api-sync-canary-redis-nonce
    user: "999:1000"
    read_only: true
    mem_limit: 128m
    restart: unless-stopped
    logging:
      driver: "none"
    volumes:
      - type: bind
        source: /mnt/data/sub2api-gate/redis/nonce
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/data/sub2api-gate/redis/nonce-users.acl
        target: /etc/redis/users.acl
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=999,gid=1000
    command:
      - redis-server
      - --aclfile
      - /etc/redis/users.acl
      - --appendonly
      - "yes"
      - --appendfsync
      - "always"
      - --save
      - ""
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - noeviction
      - --aof-use-rdb-preamble
      - "yes"
    environment:
      REDISCLI_AUTH: ${SUB2API_SYNC_REDIS_PASSWORD:?SUB2API_SYNC_REDIS_PASSWORD is required}
      TZ: ${TZ:-UTC}
    networks:
      - migrated-target-data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core:
        soft: 0
        hard: 0
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-server --version | grep -F 'v=8.8.0' >/dev/null &&
          redis-cli --user sub2api_sync ping | grep -qx PONG
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

networks:
  migrated-target-data:
    external: true
    name: sub2api-gate-traffic-canary_traffic-canary-data
