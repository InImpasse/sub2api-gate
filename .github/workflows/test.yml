name: Test

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker-allow-ip/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install Worker dependencies
        run: npm ci
        working-directory: worker-allow-ip
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: worker-allow-ip
      - name: Verify release policy
        run: python3 -I deploy/verify-release-policy.py
      - name: Audit Worker dependencies
        run: npm --prefix worker-allow-ip audit --audit-level=high --package-lock-only --ignore-scripts
      - name: Check core coverage
        run: bash deploy/check-core-coverage.sh
      - name: Check release tool coverage
        run: bash deploy/check-release-tool-coverage.sh
      - name: Test sync dependencies
        run: bash deploy/run-sync-dependency-integration.sh
      - name: Test browser UI
        run: npm --prefix worker-allow-ip run test:browser-ui
      - name: Check patch formatting
        run: git diff --check
      - name: Check release candidate
        run: bash deploy/check-release-candidate.sh
