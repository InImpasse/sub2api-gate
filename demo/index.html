<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sub2api-gate Demo</title>
  <meta
    name="description"
    content="Demo interface for Sub2API allowlist access and UUID-based user administration."
  />
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe7;
      --bg-strong: #efe4d4;
      --surface: rgba(255, 251, 245, 0.84);
      --surface-strong: #fffaf3;
      --surface-muted: rgba(109, 82, 52, 0.08);
      --text: #21160d;
      --text-soft: #6b5846;
      --text-faint: #8a7662;
      --line: rgba(84, 57, 31, 0.14);
      --line-strong: rgba(84, 57, 31, 0.24);
      --accent: #b6542e;
      --accent-strong: #8f3f21;
      --accent-soft: rgba(182, 84, 46, 0.12);
      --success: #237253;
      --success-soft: rgba(35, 114, 83, 0.12);
      --error: #a33422;
      --error-soft: rgba(163, 52, 34, 0.12);
      --shadow-lg: 0 24px 80px rgba(59, 35, 14, 0.12);
      --shadow-md: 0 14px 36px rgba(59, 35, 14, 0.08);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
      --font-body: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      --font-mono: "SFMono-Regular", "Cascadia Code", "Fira Code", Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #19130e;
        --bg-strong: #241b13;
        --surface: rgba(39, 29, 20, 0.84);
        --surface-strong: #2a2018;
        --surface-muted: rgba(255, 232, 212, 0.06);
        --text: #f7ecde;
        --text-soft: #d6c4b0;
        --text-faint: #ac9884;
        --line: rgba(255, 233, 212, 0.12);
        --line-strong: rgba(255, 233, 212, 0.22);
        --accent: #ff8e5f;
        --accent-strong: #ffaf8e;
        --accent-soft: rgba(255, 142, 95, 0.14);
        --success: #67d6aa;
        --success-soft: rgba(103, 214, 170, 0.12);
        --error: #ff8d7c;
        --error-soft: rgba(255, 141, 124, 0.14);
        --shadow-lg: 0 28px 90px rgba(0, 0, 0, 0.36);
        --shadow-md: 0 16px 44px rgba(0, 0, 0, 0.24);
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: var(--font-body);
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 223, 183, 0.42), transparent 32%),
        radial-gradient(circle at 85% 18%, rgba(182, 84, 46, 0.14), transparent 26%),
        linear-gradient(180deg, var(--bg-strong) 0%, var(--bg) 48%, var(--bg) 100%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a,
    input,
    [role="button"] {
      transition:
        background-color 180ms ease,
        border-color 180ms ease,
        color 180ms ease,
        box-shadow 180ms ease,
        transform 180ms ease,
        opacity 180ms ease;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    .tab:focus-visible {
      outline: 3px solid var(--accent-soft);
      outline-offset: 2px;
    }

    .skip-link {
      position: absolute;
      left: 16px;
      top: 16px;
      transform: translateY(-160%);
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      z-index: 200;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .page-shell {
      position: relative;
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .demo-badge {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 100;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 250, 243, 0.55);
      backdrop-filter: blur(14px);
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .ambient-orb,
    .ambient-grid {
      position: fixed;
      inset: auto;
      pointer-events: none;
      z-index: 0;
    }

    .ambient-orb {
      width: 320px;
      height: 320px;
      right: -80px;
      bottom: -80px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(182, 84, 46, 0.18), transparent 68%);
      filter: blur(8px);
    }

    .ambient-grid {
      inset: 0;
      opacity: 0.26;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.24), transparent 80%);
    }

    .app-layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
      gap: 24px;
      align-items: start;
    }

    .intro-panel,
    .workspace {
      border: 1px solid var(--line);
      background: var(--surface);
      backdrop-filter: blur(18px) saturate(135%);
      box-shadow: var(--shadow-lg);
    }

    .intro-panel {
      position: sticky;
      top: 24px;
      overflow: hidden;
      border-radius: var(--radius-xl);
      min-height: 760px;
      padding: 28px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 28px;
    }

    .intro-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 16%, rgba(255, 214, 178, 0.38), transparent 24%),
        linear-gradient(135deg, transparent 0%, rgba(182, 84, 46, 0.06) 100%);
      pointer-events: none;
    }

    .workspace {
      border-radius: var(--radius-xl);
      padding: 24px;
      display: grid;
      gap: 20px;
    }

    .brand-row,
    .hero-head,
    .section-stack,
    .metric-grid,
    .step-list,
    .panel-stack,
    .dashboard-grid,
    .user-list,
    .action-row,
    .field,
    .message,
    .helper-callout,
    .status-strip,
    .api-card,
    .tab-panel {
      display: grid;
      gap: 12px;
    }

    .brand-row {
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.92), rgba(255, 239, 223, 0.72));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        0 16px 34px rgba(123, 67, 37, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.55);
    }

    @media (prefers-color-scheme: dark) {
      .brand-mark {
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 170, 122, 0.14));
        border-color: rgba(255, 255, 255, 0.08);
      }
    }

    .brand-mark svg {
      width: 34px;
      height: 34px;
    }

    .eyebrow {
      margin: 0;
      color: var(--text-faint);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .brand-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .hero-title,
    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2.7rem, 5vw, 4.5rem);
      line-height: 0.96;
      letter-spacing: -0.05em;
      font-weight: 700;
      max-width: 10ch;
    }

    .hero-copy,
    .lede,
    p {
      margin: 0;
      color: var(--text-soft);
      line-height: 1.65;
    }

    .hero-copy {
      max-width: 46ch;
      font-size: 1.02rem;
    }

    .hero-tags,
    .step-pills,
    .support-links,
    .top-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .tag,
    .step-pill,
    .micro-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.38);
      color: var(--text-soft);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .metric-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .metric-card {
      padding: 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: var(--surface-muted);
    }

    .metric-value {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.7rem;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .metric-label {
      margin: 0;
      color: var(--text-faint);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .section-card,
    .panel,
    .message {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface-strong);
      box-shadow: var(--shadow-md);
    }

    .section-card {
      padding: 18px;
    }

    .section-title {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    .step-list {
      gap: 10px;
    }

    .step {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: start;
    }

    .step-index {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 700;
    }

    .step strong,
    .section-card strong,
    .api-card strong,
    .user-card strong {
      color: var(--text);
      font-size: 15px;
    }

    .step small,
    .section-card small,
    .user-card small,
    .helper-note {
      color: var(--text-faint);
      line-height: 1.5;
    }

    .trust-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .workspace-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }

    .workspace-copy h1 {
      max-width: none;
      font-size: clamp(2rem, 4vw, 3.3rem);
    }

    .workspace-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .panel {
      padding: 22px;
    }

    .panel-stack {
      gap: 18px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 14px;
    }

    .panel-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.55rem;
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .panel-subtitle {
      margin: 0;
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.6;
    }

    .helper-callout,
    .status-strip {
      padding: 14px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: var(--surface-muted);
    }

    .helper-callout strong,
    .status-strip strong {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .field label {
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .field-hint {
      margin-top: -6px;
      color: var(--text-faint);
      font-size: 13px;
      line-height: 1.5;
    }

    .secret-field,
    .copy-line,
    .secret-copy-line {
      display: grid;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .secret-field {
      grid-template-columns: minmax(0, 1fr) auto;
      min-height: 56px;
      padding: 6px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.54);
    }

    .secret-field:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: 15px;
      padding: 0 14px;
    }

    input::placeholder {
      color: var(--text-faint);
    }

    button,
    a.btn {
      min-height: 48px;
      border: 0;
      border-radius: 999px;
      padding: 0 18px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    button:hover,
    a.btn:hover {
      transform: translateY(-1px);
    }

    button:active,
    a.btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 12px 26px rgba(182, 84, 46, 0.22);
    }

    .btn-primary:hover {
      background: var(--accent-strong);
    }

    .btn-secondary,
    button.ghost,
    button.ghost-wide,
    a.btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .btn-secondary:hover,
    button.ghost:hover,
    button.ghost-wide:hover,
    a.btn-secondary:hover {
      background: var(--surface-muted);
    }

    button.ghost {
      min-height: 40px;
      padding: 0 14px;
      color: var(--text-soft);
    }

    button.ghost-wide {
      width: 100%;
      min-height: 46px;
    }

    button.compact {
      min-height: 36px;
      padding: 0 12px;
      font-size: 13px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none;
      box-shadow: none;
    }

    .action-row {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .cf-turnstile-mock {
      padding: 16px;
      border-radius: 16px;
      border: 1px dashed var(--line-strong);
      background: var(--surface-muted);
    }

    .cf-turnstile-mock.checked {
      border-style: solid;
      border-color: rgba(35, 114, 83, 0.28);
      background: var(--success-soft);
      color: var(--success);
    }

    .turnstile-label {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      color: inherit;
      font-size: 14px;
      line-height: 1.5;
    }

    .turnstile-label input {
      width: 18px;
      height: 18px;
      min-height: auto;
      padding: 0;
      accent-color: var(--accent);
    }

    .message {
      padding: 16px;
      line-height: 1.58;
    }

    .message.success,
    .status-strip.success {
      border-color: rgba(35, 114, 83, 0.18);
      background: var(--success-soft);
      color: var(--success);
    }

    .message.error,
    .status-strip.error,
    .admin-status.error {
      border-color: rgba(163, 52, 34, 0.2);
      background: var(--error-soft);
      color: var(--error);
    }

    code {
      font-family: var(--font-mono);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .copy-line {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .secret-copy-line {
      grid-template-columns: minmax(0, 1fr) auto auto;
    }

    .copy-secret {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0 12px;
      background: transparent;
    }

    .dashboard-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .api-card {
      padding: 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: var(--surface-muted);
    }

    .api-card label {
      color: var(--text-faint);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-banner {
      display: grid;
      gap: 10px;
      padding: 18px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(35, 114, 83, 0.18);
      background: linear-gradient(180deg, var(--success-soft), rgba(255, 255, 255, 0.03));
    }

    .status-banner p {
      color: inherit;
    }

    .top-nav {
      justify-content: space-between;
    }

    .top-nav .nav-left,
    .top-nav .nav-right {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-muted);
    }

    .tab {
      min-height: 40px;
      padding: 0 16px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--text-soft);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      background: var(--surface-strong);
      color: var(--text);
      box-shadow: 0 8px 20px rgba(59, 35, 14, 0.08);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: grid;
    }

    .admin-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .admin-form .span-2 {
      grid-column: 1 / -1;
    }

    .user-list {
      max-height: 420px;
      overflow: auto;
      padding-right: 4px;
    }

    .user-card {
      padding: 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: var(--surface-muted);
    }

    .user-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .admin-status {
      padding: 15px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: var(--surface-muted);
      line-height: 1.58;
      color: var(--text-soft);
    }

    .footer-note {
      color: var(--text-faint);
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }

    .footer-note a {
      color: var(--accent-strong);
      text-underline-offset: 3px;
    }

    .fade-up {
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 620ms ease forwards;
    }

    .delay-1 { animation-delay: 70ms; }
    .delay-2 { animation-delay: 140ms; }
    .delay-3 { animation-delay: 210ms; }
    .delay-4 { animation-delay: 280ms; }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (max-width: 980px) {
      .app-layout {
        grid-template-columns: 1fr;
      }

      .intro-panel {
        position: static;
        min-height: auto;
      }
    }

    @media (max-width: 680px) {
      .page-shell {
        width: min(100%, calc(100% - 20px));
        padding-top: 20px;
      }

      .demo-badge {
        top: 12px;
        right: 12px;
      }

      .intro-panel,
      .workspace,
      .panel {
        padding: 18px;
      }

      .metric-grid,
      .dashboard-grid,
      .action-row,
      .admin-form {
        grid-template-columns: 1fr;
      }

      .copy-line,
      .secret-copy-line,
      .secret-field {
        grid-template-columns: 1fr;
      }

      .workspace-header,
      .panel-head,
      .top-nav {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <span class="demo-badge">Demo</span>
  <div class="ambient-grid" aria-hidden="true"></div>
  <div class="ambient-orb" aria-hidden="true"></div>
  <main class="page-shell" id="app"></main>

  <script>
    let view = "form";
    let turnstilePassed = false;
    let currentInvite = null;
    let adminStatusMessage = 'Try adding a user, then test a duplicate like <code>Alice!!</code> to see normalization and conflict handling.';
    let adminStatusKind = "";
    let adminUsers = [
      {
        username: "alice",
        email: "alice@sub2api.local",
        uuid: "c1f3d8f1-3d45-4de8-8a1d-2f8c1d4c1022",
        remark: "Engineering sandbox"
      },
      {
        username: "ops-oncall",
        email: "ops@sub2api.local",
        uuid: "df0d3ec4-45b0-4aa8-a1d5-b1a4f62ef114",

    function esc(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function maskSecret(value) {
      if (!value) return "Not configured";
      return value.startsWith("sk-") ? "sk-********" : "********";
    }

    function normalizeUsername(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9._-]+/g, "-")
        .replace(/^[._-]+|[._-]+$/g, "")
        .slice(0, 100);
    }

    function switchTab(tabName) {
      document.querySelectorAll(".tab").forEach((tab) => {
        const active = tab.dataset.tab === tabName;
        tab.classList.toggle("active", active);
        tab.setAttribute("aria-selected", String(active));
      });
      document.querySelectorAll(".tab-panel").forEach((panel) => {
        panel.classList.toggle("active", panel.id === `tab-${tabName}`);
      });
    }

    function bindEvents() {
      document.querySelectorAll(".toggle-secret").forEach((button) => {
        button.addEventListener("click", () => {
          const input = document.getElementById("invite_key");
          if (!input) return;
          const show = input.type === "password";
          input.type = show ? "text" : "password";
          button.textContent = show ? "Hide" : "Show";
          button.setAttribute("aria-pressed", String(show));
        });
      });

      document.querySelectorAll(".toggle-dashboard-secret").forEach((button) => {
        button.addEventListener("click", () => {
          const input = button.closest(".secret-copy-line")?.querySelector(".copy-secret");
          if (!input) return;
          const show = input.type === "password";
          input.type = show ? "text" : "password";
          button.textContent = show ? "Hide" : "Show";
          button.setAttribute("aria-pressed", String(show));
          document.querySelectorAll(".secret-format").forEach((codeEl) => {
            codeEl.textContent = show ? codeEl.dataset.fullValue : codeEl.dataset.maskedValue;
          });
        });
      });

      document.querySelectorAll(".copy-value").forEach((button) => {
        button.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(button.dataset.copy || "");
            const original = button.textContent;
            button.textContent = "Copied";
            setTimeout(() => {
              button.textContent = original;
            }, 1400);
          } catch {}
        });
      });

      const previewDemo = document.getElementById("previewDemo");
      if (previewDemo) {
        previewDemo.addEventListener("click", () => {
          const input = document.getElementById("invite_key");
          if (!input) return;
          input.value = "demo-key-001";
          input.focus();
        });
      }

      const check = document.getElementById("turnstileCheck");
      const submitButton = document.getElementById("submitBtn");
      const turnstileMock = document.getElementById("turnstileMock");
      if (check && submitButton && turnstileMock) {
        check.addEventListener("change", () => {
          turnstilePassed = check.checked;
          submitButton.disabled = !turnstilePassed;
          turnstileMock.classList.toggle("checked", turnstilePassed);
        });
      }

      const allowForm = document.getElementById("allowForm");
      if (allowForm) {
        allowForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const key = document.getElementById("invite_key")?.value.trim();
          const invite = MOCK_INVITES[key];
          if (!invite) {
            alert("Invalid key. Try demo-key-001 or demo-invite-001.");
            return;
          }
          currentInvite = { ...invite };
          view = "dashboard";
          render();
        });
      }

      const goAdmin = document.getElementById("goAdmin");
      if (goAdmin) {
        goAdmin.addEventListener("click", () => {
          view = "admin";
          render();
        });
      }

      const goAdminFooter = document.getElementById("goAdminFooter");
      if (goAdminFooter) {
        goAdminFooter.addEventListener("click", (event) => {
          event.preventDefault();
          view = "admin";
          render();
        });
      }

      const goBack = document.getElementById("goBack");
      if (goBack) {
        goBack.addEventListener("click", () => {
          view = currentInvite ? "dashboard" : "form";
          render();
        });
      }

      const logoutButton = document.getElementById("logoutBtn");
      if (logoutButton) {
        logoutButton.addEventListener("click", () => {
          currentInvite = null;
          turnstilePassed = false;
          view = "form";
          render();
        });
      }

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          switchTab(tab.dataset.tab);
        });
      });

      const addUserForm = document.getElementById("addUserForm");
      const usernameInput = document.getElementById("a-username");
      const uuidInput = document.getElementById("a-uuid");
      const emailInput = document.getElementById("a-email");
      const remarkInput = document.getElementById("a-remark");
      const statusEl = document.getElementById("adminStatus");

      if (uuidInput && !uuidInput.value) {
        uuidInput.value = crypto.randomUUID();
      }

      if (usernameInput) {
        usernameInput.addEventListener("input", () => {
          usernameInput.value = normalizeUsername(usernameInput.value);
          usernameInput.setCustomValidity("");
        });
      }

      if (addUserForm && usernameInput && uuidInput && emailInput && remarkInput && statusEl) {
        addUserForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const username = normalizeUsername(usernameInput.value);
          usernameInput.value = username;

          if (!username) {
            usernameInput.setCustomValidity("Username is required.");
            usernameInput.reportValidity();
            adminStatusKind = "error";
            adminStatusMessage = "Username cannot be empty.";
            statusEl.className = "admin-status error";
            statusEl.textContent = adminStatusMessage;
            return;
          }

          const duplicate = adminUsers.some((user) => normalizeUsername(user.username) === username);
          if (duplicate) {
            usernameInput.setCustomValidity("Username already exists.");
            usernameInput.reportValidity();
            adminStatusKind = "error";
            adminStatusMessage = `"${username}" already exists after normalization.`;
            statusEl.className = "admin-status error";
            statusEl.textContent = adminStatusMessage;
            return;
          }

          const email = emailInput.value.trim() || `${username}@sub2api.local`;
          adminUsers.unshift({
            username,
            email,
            uuid: uuidInput.value.trim() || crypto.randomUUID(),
            remark: remarkInput.value.trim()
          });

          addUserForm.reset();
          uuidInput.value = crypto.randomUUID();
          adminStatusKind = "";
          adminStatusMessage = `Added "${username}". In production this would also provision the Sub2API user and API key.`;
          statusEl.className = "admin-status";
          statusEl.textContent = adminStatusMessage;

          view = "admin";
          render();
          switchTab("users");
        });
      }

      const loadConflict = document.getElementById("loadConflict");
      if (loadConflict && usernameInput && uuidInput && emailInput && remarkInput && statusEl) {
        loadConflict.addEventListener("click", () => {
          usernameInput.value = "Alice!!";
          emailInput.value = "alice2@sub2api.local";
          uuidInput.value = crypto.randomUUID();
          remarkInput.value = "Intentional duplicate";
          usernameInput.focus();
          adminStatusKind = "";
          adminStatusMessage = 'Filled with "Alice!!" which normalizes to an existing username. Submit to preview the duplicate check.';
          statusEl.className = "admin-status";
          statusEl.textContent = adminStatusMessage;
        });
      }
    }

    render();
  </script>
</body>
</html>
