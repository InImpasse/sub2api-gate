# Validation stage for this hostname's custom Authenticated Origin Pull CA.
# A missing certificate is allowed, but any certificate that is sent is verified.
ssl_client_certificate /etc/nginx/sub2api-gate/aop/client-ca.pem;
ssl_verify_client optional;
ssl_verify_depth 2;

# This endpoint is present only on the reviewed AOP TLS vhosts.
# A unique query string is supplied by the installer to bypass edge caches.
location = /.well-known/sub2api-aop-probe {
    add_header Cache-Control "no-store" always;
    add_header X-Sub2API-AOP-Verify $ssl_client_verify always;
    if ($ssl_client_verify != SUCCESS) {
        return 403;
    }
    return 204;
}
