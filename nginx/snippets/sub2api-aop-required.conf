# Enforcement stage for this hostname's custom Authenticated Origin Pull CA.
ssl_client_certificate /etc/nginx/sub2api-gate/aop/client-ca.pem;
ssl_verify_client on;
ssl_verify_depth 2;


# Retained so the installer can verify the required-stage reload through the
# public Cloudflare hostname before it commits the transition.
location = /.well-known/sub2api-aop-probe {
    add_header Cache-Control "no-store" always;
    add_header X-Sub2API-AOP-Verify $ssl_client_verify always;
    return 204;
}
