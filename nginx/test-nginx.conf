user nginx;
worker_processes 1;
worker_rlimit_core 0;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    include /workspace/nginx/00-connection-upgrade-map.conf;
    include /workspace/nginx/cloudflare-source-geo.conf;
    include /workspace/nginx/sub2api-sync-limit.conf;
    include /workspace/nginx/sub2api.conf;

    # A loopback-only synthetic Sub2API used to prove the proxy hop and headers.
    server {
        listen 127.0.0.1:8080;
        server_name _;

        location / {
            default_type text/plain;
            return 200 "sub2api-direct|uri=$request_uri|xreal=$http_x_real_ip|xff=$http_x_forwarded_for|connection=$http_connection|upgrade=$http_upgrade|accept=$http_accept|";
        }
    }

    server {
        listen 127.0.0.1:3021;
        server_name _;

        location = /provision {
            if ($http_x_test_sync_failure = "1") {
                return 444;
            }
            if ($http_x_test_sync_app_error = "429") {
                return 429 '{"ok":false,"error":"upstream_rate_limited","retryable":true,"requestId":"$http_x_request_id"}';
            }
            if ($http_x_test_sync_app_error = "502") {
                return 502 '{"ok":false,"error":"upstream_invalid_response","retryable":true,"requestId":"$http_x_request_id"}';
            }
            if ($http_x_test_sync_app_error = "504") {
                return 504 '{"ok":false,"error":"dependency_timeout","retryable":true,"requestId":"$http_x_request_id"}';
            }
            default_type application/json;
            add_header x-request-id $http_x_request_id always;
            return 200 '{"ok":true,"requestId":"$http_x_request_id"}';
        }
    }
}
