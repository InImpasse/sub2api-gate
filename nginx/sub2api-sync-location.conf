    location = /_sub2api-sync/provision {
        include /etc/nginx/snippets/cloudflare-only.conf;
        limit_except POST { deny all; }
        client_max_body_size 16k;
        limit_req zone=sub2api_sync burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @sub2api_sync_rate_limited;
        error_page 502 = @sub2api_sync_upstream_unavailable;
        error_page 504 = @sub2api_sync_dependency_timeout;
        proxy_pass http://127.0.0.1:3021/provision;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 9s;
        proxy_send_timeout 9s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        access_log off;
        error_log /dev/null crit;
    }

    location @sub2api_sync_rate_limited {
        internal;
        default_type application/json;
        add_header cache-control "no-store" always;
        add_header x-content-type-options "nosniff" always;
        add_header referrer-policy "no-referrer" always;
        add_header content-security-policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header x-request-id $request_id always;
        add_header retry-after "1" always;
        return 429 '{"ok":false,"error":"rate_limited","retryable":true,"requestId":"$request_id"}';
    }

    location @sub2api_sync_upstream_unavailable {
        internal;
        default_type application/json;
        add_header cache-control "no-store" always;
        add_header x-content-type-options "nosniff" always;
        add_header referrer-policy "no-referrer" always;
        add_header content-security-policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header x-request-id $request_id always;
        return 502 '{"ok":false,"error":"upstream_unavailable","retryable":true,"requestId":"$request_id"}';
    }

    location @sub2api_sync_dependency_timeout {
        internal;
        default_type application/json;
        add_header cache-control "no-store" always;
        add_header x-content-type-options "nosniff" always;
        add_header referrer-policy "no-referrer" always;
        add_header content-security-policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header x-request-id $request_id always;
        add_header retry-after "1" always;
        return 504 '{"ok":false,"error":"dependency_timeout","retryable":true,"requestId":"$request_id"}';
    }
