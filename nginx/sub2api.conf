server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    include /etc/nginx/snippets/cloudflare-only.conf;

    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        return 200 "ok";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    include /etc/nginx/snippets/cloudflare-only.conf;
    # Stronger origin lock: enable Cloudflare Authenticated Origin Pulls,
    # install the CA file, then uncomment the next line.
    # include /etc/nginx/snippets/cloudflare-authenticated-origin-pull.conf;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:sub2api_ssl:10m;

    underscores_in_headers on;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /allow-ip {
        return 404;
    }

    include /etc/nginx/snippets/sub2api-sync-location.conf;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
