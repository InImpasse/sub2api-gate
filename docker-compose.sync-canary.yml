name: sub2api-gate-sync-canary

# Provisioning-only canary for the active production data plane. This stack is
# intentionally separate from both Sub2API traffic and /v1 routing. It reuses
# the reviewed live PostgreSQL, Sub2API, and nonce-only Redis containers.
x-required-data-root: ${SUB2API_DATA_ROOT:?SUB2API_DATA_ROOT must be /mnt/data/sub2api-gate}

x-sync-environment: &sync-environment
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  SUB2API_SYNC_HOST: 0.0.0.0
  SUB2API_SYNC_PORT: "3021"
  SUB2API_SYNC_SECRET: ${SUB2API_SYNC_SECRET:?SUB2API_SYNC_SECRET is required}
  SUB2API_SYNC_DATABASE_HOST: postgres
  SUB2API_SYNC_DATABASE_PORT: "5432"
  SUB2API_SYNC_DATABASE_NAME: ${POSTGRES_DB:-sub2api}
  SUB2API_SYNC_DATABASE_USER: sub2api_sync
  SUB2API_SYNC_DATABASE_PASSWORD: ${SUB2API_SYNC_DATABASE_PASSWORD:?SUB2API_SYNC_DATABASE_PASSWORD is required}
  SUB2API_SYNC_REDIS_HOST: redis-nonce
  SUB2API_SYNC_REDIS_PORT: "6379"
  SUB2API_SYNC_REDIS_USERNAME: sub2api_sync
  SUB2API_SYNC_REDIS_PASSWORD: ${SUB2API_SYNC_REDIS_PASSWORD:?SUB2API_SYNC_REDIS_PASSWORD is required}
  SUB2API_SYNC_REDIS_DB: ${REDIS_DB:-0}
  SUB2API_INTERNAL_LOGIN_URL: http://sub2api:8080/api/v1/auth/login
  SUB2API_SYNC_DEFAULT_GROUP: openai-default
  SUB2API_LOGIN_URL: ${SUB2API_LOGIN_URL:?SUB2API_LOGIN_URL is required}
  SUB2API_PUBLIC_BASE_URL: ${SUB2API_PUBLIC_BASE_URL:?SUB2API_PUBLIC_BASE_URL is required}

x-sync-service: &sync-service
  # prepare-image builds and records the exact local image ID before any
  # canary or stable service is allowed to start.
  image: sub2api-gate/sub2api-sync:pg18.4-r1
  pull_policy: never
  user: "65532:65532"
  read_only: true
  init: true
  restart: unless-stopped
  logging:
    driver: "none"
  environment: *sync-environment
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=65532,gid=65532
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  mem_limit: 128m
  cpus: 0.50
  ulimits:
    core:
      soft: 0
      hard: 0
  networks:
    - live-data
  healthcheck:
    test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3021/healthz', timeout=4)
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 10s

services:
  sub2api-sync-canary:
    <<: *sync-service
    profiles: ["sync-canary"]
    container_name: sub2api-sync-canary
    labels:
      sub2api-gate.canary-purpose: provisioning-sync-only
      sub2api-gate.request-path: never-v1

  sub2api-sync-stable:
    <<: *sync-service
    profiles: ["sync-stable"]
    container_name: sub2api-sync-stable
    labels:
      sub2api-gate.canary-purpose: provisioning-sync-stable
      sub2api-gate.request-path: never-v1

networks:
  live-data:
    external: true
    name: sub2api-gate-release_sub2api-data
